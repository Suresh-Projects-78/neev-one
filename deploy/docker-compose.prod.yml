# Production overlay: HTTPS via Caddy in front of the stack.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# Set DOMAIN in .env (e.g. books.example.com) with DNS pointed at this host;
# Caddy provisions and renews Let's Encrypt certificates on its own. The web
# and api ports stop being published directly — Caddy is the only way in.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env for HTTPS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [appnet]
    depends_on:
      web:
        condition: service_healthy

  web:
    ports: []

  api:
    ports: []

volumes:
  caddy-data:
  caddy-config:
