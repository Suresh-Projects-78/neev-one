<!doctype html><html><head><meta charset="utf-8"><title>geo2</title>
<script type="module">import '/src/index.css';</script></head>
<body style="background:rgb(var(--app-bg));padding:20px;font-family:Inter,sans-serif">
<div style="max-width:900px">
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:18px" id="tb">
    <input class="ui-input" style="flex:1;min-width:0" placeholder="Search">
    <select class="ui-select w-40"><option>All statuses</option></select>
    <button class="ui-btn ui-btn-secondary">Filter</button>
    <button class="ui-btn ui-btn-secondary">Columns</button>
    <button class="ui-btn ui-btn-secondary">Export</button>
    <button class="ui-btn ui-btn-primary">+ New</button>
  </div>
  <div style="display:flex;gap:8px;align-items:center" id="cmp">
    <input class="ui-input ui-ctl-compact w-32" placeholder="Filter">
    <select class="ui-select ui-ctl-compact w-40"><option>Any</option></select>
    <button class="ui-btn ui-btn-secondary ui-btn-sm">Small</button>
    <button class="ui-icon-btn">×</button>
  </div>
</div>
<pre id="out" style="font:12px ui-monospace;color:rgb(var(--fg));margin-top:18px"></pre>
<script type="module">
setTimeout(()=>{
 const H=el=>Math.round(el.getBoundingClientRect().height);
 const tb=[...document.querySelectorAll('#tb > *')].map(H);
 const cmp=[...document.querySelectorAll('#cmp > *')].map(H);
 const cs=document.querySelector('.ui-ctl-compact.ui-select');
 document.getElementById('out').textContent=JSON.stringify({
  toolbarHeights:tb, toolbarAllEqual:new Set(tb).size===1,
  compactHeights:cmp, compactAllEqual:new Set(cmp).size===1,
  compactSelectPadRight:getComputedStyle(cs).paddingRight,
  compactChevronSize:getComputedStyle(cs).backgroundSize,
 },null,1);
},400);
</script></body></html>
